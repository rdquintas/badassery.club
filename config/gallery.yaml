# yaml-language-server: $schema=./gallery.schema.json
# Photos on the gallery page (available in templates as `gallery.*`), shown
# in this order in the masonry grid. `image` is the path of the photo inside
# src/assets/img/ without the "-600/-1200.<ext>" suffix; each one needs the
# AVIF + WebP + JPG files at 600w and 1200w. `width`/`height` are the size of
# the 1200w file (only the ratio matters: the grid uses it for the layout).

# How many photos are added each time the visitor scrolls to the bottom.
batch: 12

items:
  - image: hero-cocktail
    width: 1200
    height: 1800
    alt: Cocktail art at Badassery
  - image: laboratory
    width: 1200
    height: 2133
    alt: The Laboratory, 1st floor
