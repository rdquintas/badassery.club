<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Catch the Vibe - BADASSERY</title>
  <meta name="description" content="Photos of Badassery, the secret speakeasy and event venue at {{ site.address.street }}, Lisbon: The Cocktail Bar, The Laboratory, The Mini Banger and The Acoustic Chamber.">
  <link rel="canonical" href="https://badassery.club/gallery.html">

  <!-- Open Graph / Twitter -->
  <meta property="og:site_name" content="Badassery">
  <meta property="og:title" content="Catch the Vibe - BADASSERY">
  <meta property="og:url" content="https://badassery.club/gallery.html">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://badassery.club/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Catch the Vibe - BADASSERY">
  <meta name="twitter:image" content="https://badassery.club/assets/img/og-image.jpg">

  <!-- Icons -->
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">

  <!-- Fonts (self-hosted) -->
  <link rel="preload" href="assets/fonts/bebas-neue-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/raleway-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="{{ 'css/style.css' | versioned }}">
  <script src="{{ 'js/main.js' | versioned }}" defer></script>
</head>

<body>
  {% include "_partials/sprite.html" %}

  <a class="skip-link" href="#main">Skip to Content</a>

  {% include "_partials/header.html" %}

  {%- macro photo(p) -%}
  <figure class="gallery__item" data-ratio="{{ p.height / p.width }}">
    <button type="button" class="gallery__open glitch glitch--play" aria-label="Open photo: {{ p.alt }}">
      <picture>
        <source type="image/avif" srcset="assets/img/{{ p.image }}-600.avif 600w, assets/img/{{ p.image }}-1200.avif 1200w" sizes="(min-width: 1100px) 25vw, (min-width: 800px) 33vw, 50vw">
        <source type="image/webp" srcset="assets/img/{{ p.image }}-600.webp 600w, assets/img/{{ p.image }}-1200.webp 1200w" sizes="(min-width: 1100px) 25vw, (min-width: 800px) 33vw, 50vw">
        <img src="assets/img/{{ p.image }}-1200.jpg" srcset="assets/img/{{ p.image }}-600.jpg 600w, assets/img/{{ p.image }}-1200.jpg 1200w" sizes="(min-width: 1100px) 25vw, (min-width: 800px) 33vw, 50vw" width="{{ p.width }}" height="{{ p.height }}" alt="{{ p.alt }}" loading="lazy" decoding="async">
      </picture>
    </button>
  </figure>
  {%- endmacro %}

  <main id="main">
    <!-- Masonry gallery. main.js moves the photos out of the <template> in
         batches (data-batch) as the visitor scrolls, places each one in the
         shortest column and fades it in. Photos come from config/gallery.yaml. -->
    <section class="section section--first gallery" data-gallery data-batch="{{ gallery.batch }}">
      <h1 class="page-title reveal">CATCH THE VIBE</h1>

      <div class="gallery__grid" data-gallery-grid></div>
      <div class="gallery__sentinel" data-gallery-sentinel></div>

      <template data-gallery-items>
        {%- for p in gallery.items %}
        {{ photo(p) }}
        {%- endfor %}
      </template>

      <noscript>
        <div class="gallery__grid gallery__grid--static">
          {%- for p in gallery.items %}
          {{ photo(p) }}
          {%- endfor %}
        </div>
      </noscript>
    </section>
  </main>

  {% include "_partials/footer.html" %}

  <!-- Lightbox for the photos (filled and opened by main.js) -->
  <dialog class="lightbox" id="lightbox" aria-label="Photo"></dialog>
</body>
</html>
