{#- Site footer, shared by every page -#}
<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__col">
      <h4 class="reveal">LOCATION</h4>
      <p class="reveal"><a class="link-fill" href="{{ site.google_maps_url }}" target="_blank" rel="noopener">{{ site.address.street }}<br>{{ site.address.city | upper }}, {{ site.address.postal_code }}</a></p>
    </div>
    <div class="site-footer__col">
      <h4 class="reveal">HOURS</h4>
      {%- for h in site.hours %}
      <p class="reveal">{{ h.days }}<br>{{ h.time }}</p>
      {%- endfor %}
    </div>
    <div class="site-footer__col">
      <h4 class="reveal">CONTACT</h4>
      <p class="reveal"><a class="link-fill" href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    </div>
  </div>

  <a class="site-footer__social reveal" href="{{ site.instagram_url }}" target="_blank" rel="noopener" aria-label="Instagram">
    <svg class="icon" aria-hidden="true"><use href="#icon-instagram"/></svg>
  </a>

  <a class="site-footer__logo glitch reveal" href="/">
    <picture>
      <source type="image/webp" srcset="assets/img/logo.webp">
      <img src="assets/img/logo.png" alt="Badassery" width="1191" height="213" loading="lazy" decoding="async">
    </picture>
  </a>
</footer>
